<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1eee6"><title>SONGWRITER — work in progress</title><style>
:root{--paper:#f1eee6;--ink:#161616;--muted:#88847b;--red:#a9362c;--line:#d7d2c7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Georgia,'Times New Roman',serif}.top{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-family:Arial,sans-serif;position:sticky;top:0;background:rgba(241,238,230,.94);backdrop-filter:blur(8px);z-index:5}.logo{font-size:13px;letter-spacing:.2em;font-weight:800}.logo em{color:var(--red);font-style:normal}.status{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.workspace{max-width:980px;margin:auto;padding:8vh 6vw 18vh}.meta{font:10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:22px;flex-wrap:wrap;margin-bottom:22px}.title{width:100%;border:0;outline:0;background:none;font:normal clamp(52px,9vw,112px)/.88 Georgia,'Times New Roman',serif;letter-spacing:-.055em;color:var(--ink);padding:0;margin:0 0 62px}.title::placeholder{color:#c8c3b8}.section{margin:0 0 66px}.section-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-bottom:15px;font:700 10px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.section-name{cursor:text}.delete{border:0;background:none;color:#aaa;font-size:18px}.delete:hover{color:var(--red)}.line{position:relative;margin:0 0 16px}.chords{display:flex;align-items:flex-end;min-height:29px;font:700 14px/1.1 'Courier New',monospace;color:var(--red);white-space:nowrap}.slot{display:inline-block;position:relative;height:29px;margin-right:.22em;flex:0 0 auto}.slot input{position:absolute;left:-2px;bottom:0;width:56px;height:22px;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;color:var(--red);font:700 14px 'Courier New',monospace;padding:0}.slot input:focus{border-bottom-color:var(--red)}.lyrics{display:block;width:100%;min-height:54px;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:var(--ink);font:normal clamp(24px,3vw,34px)/1.55 Georgia,'Times New Roman',serif;letter-spacing:-.015em;padding:0;margin:0}.lyrics::placeholder{color:#bdb8ae}.line+.line{margin-top:8px}.line-actions{height:0;position:relative}.line-add{position:absolute;left:-28px;top:-8px;border:0;background:none;color:#b9b4aa;font:18px Arial,sans-serif;opacity:0;transition:.15s}.line:hover .line-add,.line-add:focus{opacity:1}.line-add:hover{color:var(--red)}.hint{font:10px Arial,sans-serif;color:#aaa;margin-top:3px;opacity:0;transition:.2s}.section:hover .hint{opacity:1}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;font-family:Arial,sans-serif}.btn{background:none;border:1px solid #bcb7ac;padding:11px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}.btn:hover{background:#e5e0d6}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.playing{background:var(--red);border-color:var(--red);color:white}.small-input{border:1px solid var(--line);background:transparent;padding:10px;width:70px;font:11px Arial,sans-serif;outline:0}.bar-label{font:10px Arial,sans-serif;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-left:4px}.footer-note{margin-top:50px;color:#aaa;font:10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.print-only{display:none}
@media(max-width:700px){.top{height:60px}.workspace{padding:45px 24px 90px}.title{font-size:58px;margin-bottom:45px}.section{margin-bottom:52px}.lyrics{font-size:23px}.line-add{left:-18px}.meta{gap:12px}}
@media print{body{background:white}.top,.controls,.hint,.delete,.line-add,.footer-note{display:none!important}.workspace{max-width:none;padding:0}.meta{justify-content:center;color:#222;margin-bottom:10px}.title{text-align:center;font-size:42px;margin:0 0 42px}.section{margin:0 0 30px;break-inside:avoid}.section-head{border:0;justify-content:center;margin-bottom:8px;color:#222}.chords{color:#111}.lyrics{font-size:16px;line-height:1.45}.slot input{color:#111}.print-only{display:block;text-align:center;font:9px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#777;margin-top:40px}}
</style></head><body><header class="top"><div class="logo">SONG<em>WRITER</em></div><div class="status" id="status">LIVE · SAVED</div></header><main class="workspace"><div class="meta"><span>private workspace</span><span id="wordCount">0 words</span><span id="songMeta">C · 120 BPM · 4 chords/bar</span></div><input class="title" id="title" placeholder="Untitled" autocomplete="off"><div id="sections"></div><div class="controls"><button class="btn primary" id="play">▶ Play</button><button class="btn" id="print">Print Standard</button><button class="btn" id="add">+ Section</button><label class="bar-label">Chords / bar <input class="small-input" id="chordsPerBar" type="number" min="1" max="16" value="4"></label></div><div class="footer-note">Write first. Arrange later.</div><div class="print-only">Songwriter · lead sheet</div></main><script>
const types=['Verse','Pre-Chorus','Chorus','Bridge','Intro','Outro'];let song=JSON.parse(localStorage.getItem('songwriter-current')||'null')||{title:'',key:'C',bpm:120,chordsPerBar:4,sections:[{type:'Verse',lines:[''],chords:[{}]},{type:'Chorus',lines:[''],chords:[{}]}]};migrate();let audioCtx=null,playing=false,timerIds=[];const $=x=>document.getElementById(x);
function migrate(){song.key=song.key||'C';song.bpm=+song.bpm||120;song.chordsPerBar=+song.chordsPerBar||4;song.sections.forEach(s=>{if(Array.isArray(s.lines))return;let lines=String(s.lyrics||'').split('\n');let old=typeof s.chords==='string'?{}:(s.chords||{});s.lines=lines;s.chords=lines.map(()=>old);delete s.lyrics})}
function save(){localStorage.setItem('songwriter-current',JSON.stringify(song));$('status').textContent='LIVE · SAVED'}function escape(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function autosize(el){el.style.height='auto';el.style.height=Math.max(54,el.scrollHeight)+'px'}function measure(t){const c=document.createElement('canvas'),x=c.getContext('2d');x.font='34px Georgia';return x.measureText(t).width+8}
function render(){const box=$('sections');box.innerHTML='';song.sections.forEach((s,si)=>{const a=document.createElement('article');a.className='section';a.innerHTML=`<div class="section-head"><span class="section-name">${escape(s.type)}</span><button class="delete" data-delete="${si}">×</button></div>`;s.lines.forEach((text,li)=>{const line=document.createElement('div');line.className='line';line.innerHTML=`<button class="line-add" data-insert="${si}:${li}" title="Insert line">+</button><div class="chords" data-chords="${si}:${li}"></div><textarea class="lyrics" data-line="${si}:${li}" placeholder="Begin writing…">${escape(text)}</textarea>`;a.appendChild(line);autosize(line.querySelector('textarea'));buildChords(line.querySelector('.chords'),si,li)});const hint=document.createElement('div');hint.className='hint';hint.textContent='Return creates a new line · click above a word to place a chord';a.appendChild(hint);box.appendChild(a)});updateMeta()}
function buildChords(c,si,li){const text=song.sections[si].lines[li]||'',map=song.sections[si].chords[li]||{};const parts=text.match(/\S+\s*/g)||[];if(!parts.length){addSlot(c,si,li,0,8,map[0]||'');return}parts.forEach((p,i)=>addSlot(c,si,li,i,Math.max(8,measure(p)),map[i]||''))}function addSlot(c,si,li,wi,w,val){const slot=document.createElement('span');slot.className='slot';slot.style.width=w+'px';const input=document.createElement('input');input.value=val;input.dataset.chord=`${si}:${li}:${wi}`;input.addEventListener('input',e=>{const [s,l,i]=e.target.dataset.chord.split(':').map(Number);song.sections[s].chords[l]=song.sections[s].chords[l]||{};if(e.target.value.trim())song.sections[s].chords[l][i]=e.target.value;else delete song.sections[s].chords[l][i];save()});slot.appendChild(input);c.appendChild(slot)}
function updateMeta(){let n=0;song.sections.forEach(s=>s.lines.forEach(l=>n+=(l.match(/\S+/g)||[]).length));$('wordCount').textContent=n+' words';$('songMeta').textContent=(song.key||'C')+' · '+song.bpm+' BPM · '+song.chordsPerBar+' chords/bar'}
$('title').value=song.title;$('title').addEventListener('input',e=>{song.title=e.target.value;save()});$('chordsPerBar').value=song.chordsPerBar;$('chordsPerBar').addEventListener('input',e=>{song.chordsPerBar=Math.max(1,Math.min(16,+e.target.value||1));save();updateMeta()});$('sections').addEventListener('input',e=>{if(!e.target.dataset.line)return;const [si,li]=e.target.dataset.line.split(':').map(Number),old=e.target.value,s=song.sections[si];s.lines[li]=old;save();autosize(e.target);updateMeta();if(old.includes('\n')){const parts=old.split('\n'),existing=s.chords[li]||{};s.lines.splice(li,1,...parts);s.chords.splice(li,1,...parts.map((_,i)=>i===0?existing:{}));render();const ta=document.querySelector(`[data-line="${si}:${li+parts.length-1}"]`);if(ta){ta.focus();ta.setSelectionRange(0,0)}}});$('sections').addEventListener('keydown',e=>{if(e.target.dataset.line&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const [si,li]=e.target.dataset.line.split(':').map(Number),start=e.target.selectionStart,end=e.target.selectionEnd,text=e.target.value,s=song.sections[si],left=text.slice(0,start),right=text.slice(end);s.lines[li]=left;s.lines.splice(li+1,0,right);s.chords.splice(li+1,0,{});save();render();const ta=document.querySelector(`[data-line="${si}:${li+1}"]`);if(ta){ta.focus();ta.setSelectionRange(0,0)}}});$('sections').addEventListener('click',e=>{const d=e.target.dataset.delete;if(d!==undefined){song.sections.splice(+d,1);save();render();return}const ins=e.target.dataset.insert;if(ins){const [si,li]=ins.split(':').map(Number),s=song.sections[si];s.lines.splice(li+1,0,'');s.chords.splice(li+1,0,{});save();render();const ta=document.querySelector(`[data-line="${si}:${li+1}"]`);ta?.focus()}});$('add').onclick=()=>{const type=prompt('Section',types[song.sections.length%types.length]);if(type){song.sections.push({type,lines:[''],chords:[{}]});save();render()}};$('print').onclick=()=>window.print();
function syllables(w){w=w.toLowerCase().replace(/[^a-z']/g,'');if(!w)return 0;if(w.length<=3)return 1;let n=(w.match(/[aeiouy]+/g)||[]).length;if(/e$/.test(w)&&n>1)n--;if(/le$/.test(w)&&w.length>2)n++;return Math.max(1,n)}function notesForLine(text){return (text.match(/\S+/g)||[]).flatMap(w=>Array(syllables(w)).fill(1));}function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}function chordRoot(ch){const m=(ch||'').match(/^([A-Ga-g])([#b]?)/);if(!m)return 60;const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 60+pc}function tone(freq,start,dur,type='sine',gain=.06){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(gain,start+.015);g.gain.exponentialRampToValueAtTime(.001,start+Math.max(.04,dur-.02));o.connect(g).connect(audioCtx.destination);o.start(start);o.stop(start+dur)}function stop(){timerIds.forEach(clearTimeout);timerIds=[];playing=false;$('play').textContent='▶ Play';$('play').classList.remove('playing');if(audioCtx){audioCtx.close();audioCtx=null}}
$('play').onclick=async()=>{if(playing){stop();return}audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();playing=true;$('play').textContent='■ Stop';$('play').classList.add('playing');const beat=60/song.bpm,bar=beat*4;let t=audioCtx.currentTime+.12; song.sections.forEach(s=>{s.lines.forEach((line,li)=>{const map=s.chords[li]||{},words=line.match(/\S+/g)||[];const entries=Object.entries(map).filter(([i,v])=>v);if(entries.length){const slots=Math.max(1,song.chordsPerBar);entries.forEach(([i,ch],k)=>{const st=t+k*(bar/slots);const root=chordRoot(ch);[root,root+4,root+7].forEach((m,j)=>tone(midiFreq(m),st+j*.01,Math.min(bar/slots*.9,bar*.45),'triangle',j?0.035:.055))})}const syl=notesForLine(line);if(syl.length){const noteDur=Math.max(.12,(bar*Math.max(1,Math.ceil(syl.length/song.chordsPerBar)))/syl.length);syl.forEach((_,k)=>{const st=t+k*noteDur;tone(midiFreq(72+((k*2)%12)),st,Math.min(noteDur*.75,.5),'sine',.035)})}t+=Math.max(bar,Math.ceil(Math.max(1,words.length)/song.chordsPerBar)*bar)}})});timerIds.push(setTimeout(stop,Math.max(200,(t-audioCtx.currentTime)*1000+300))};render();
</script></body></html>
