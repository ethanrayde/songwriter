<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONGWRITER</title>
<style>
:root{--paper:#f1eee6;--ink:#171717;--muted:#8a867e;--red:#a9362c;--line:#d8d3c8}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink)}body{font-family:Georgia,'Times New Roman',serif}.top{position:sticky;top:0;z-index:5;height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:rgba(241,238,230,.95);backdrop-filter:blur(8px)}.logo{font:800 13px Arial,sans-serif;letter-spacing:.2em}.logo i{color:var(--red);font-style:normal}.status{font:10px Arial,sans-serif;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.page{max-width:960px;margin:auto;padding:8vh 6vw 16vh}.meta{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font:10px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px}.title{width:100%;border:0;outline:0;background:none;color:var(--ink);font:normal clamp(50px,9vw,110px)/.9 Georgia,serif;letter-spacing:-.055em;margin:0 0 65px;padding:0}.title::placeholder{color:#c7c2b7}.section{margin-bottom:65px}.section-head{border-top:1px solid var(--line);padding-top:11px;margin-bottom:17px;display:flex;justify-content:space-between;color:var(--muted);font:700 10px Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase}.section-head button{border:0;background:none;color:#aaa;font-size:18px}.section-head button:hover{color:var(--red)}.line{margin-bottom:15px}.chords{display:flex;min-height:27px;align-items:flex-end;overflow:visible;font:700 14px 'Courier New',monospace;color:var(--red)}.slot{height:27px;flex:0 0 auto;position:relative;margin-right:3px}.slot input{position:absolute;left:0;bottom:0;width:58px;height:22px;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;color:var(--red);font:700 14px 'Courier New',monospace;padding:0}.slot input:focus{border-bottom-color:var(--red)}textarea.lyrics{display:block;width:100%;min-height:50px;padding:0;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:var(--ink);font:normal clamp(23px,3vw,34px)/1.5 Georgia,serif;letter-spacing:-.01em}textarea.lyrics::placeholder{color:#bbb6ac}.help{font:10px Arial,sans-serif;color:#aaa;margin-top:4px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:Arial,sans-serif}.btn{border:1px solid #bbb6ac;background:transparent;padding:11px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.btn:hover{background:#e5e0d6}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.playing{background:var(--red);border-color:var(--red);color:#fff}.field{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.field input{width:55px;border:1px solid var(--line);background:transparent;padding:9px;outline:0;font:11px Arial,sans-serif}.footer{margin-top:48px;color:#aaa;font:10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}@media(max-width:700px){.page{padding:45px 24px 90px}.title{font-size:58px;margin-bottom:45px}.lyrics{font-size:23px}}
@media print{body{background:#fff}.top,.controls,.help,.section-head button,.footer{display:none!important}.page{max-width:700px;padding:0;margin:auto}.meta{justify-content:center;color:#222;margin-bottom:8px}.title{text-align:center;font-size:42px;margin:0 0 42px}.section{break-inside:avoid;margin-bottom:30px}.section-head{border:0;justify-content:center;color:#222;margin-bottom:7px}.lyrics{font-size:16px!important;line-height:1.45!important}.slot input{color:#111}.chords{color:#111}}
</style>
</head>
<body>
<header class="top"><div class="logo">SONG<i>WRITER</i></div><div class="status" id="status">LIVE · SAVED</div></header>
<main class="page">
<div class="meta"><span>private workspace</span><span id="count">0 words</span><span id="meta">C · 120 BPM · 4 chords/bar</span></div>
<input id="title" class="title" placeholder="Untitled" autocomplete="off">
<div id="sections"></div>
<div class="controls"><button class="btn primary" id="play">▶ Play</button><button class="btn" id="print">Print Standard</button><button class="btn" id="add">+ Section</button><label class="field">Chords / bar <input id="cpb" type="number" min="1" max="16" value="4"></label></div>
<div class="footer">Write first. Arrange later.</div>
</main>
<script>
(function(){
'use strict';
var KEY='songwriter-current';
var song=load();
var audio=null,playing=false,stopTimer=null;
var $=function(id){return document.getElementById(id)};
function fresh(){return {title:'',key:'C',bpm:120,chordsPerBar:4,sections:[{type:'Verse',lines:[''],chords:[{}]},{type:'Chorus',lines:[''],chords:[{}]}]};}
function load(){var raw=null;try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!raw)return fresh();raw.key=raw.key||'C';raw.bpm=Number(raw.bpm)||120;raw.chordsPerBar=Number(raw.chordsPerBar)||4;raw.sections=Array.isArray(raw.sections)?raw.sections:[];raw.sections.forEach(function(s){if(Array.isArray(s.lines)){s.chords=Array.isArray(s.chords)?s.chords:[];while(s.chords.length<s.lines.length)s.chords.push({});return}var old=s.chords&&typeof s.chords==='object'?s.chords:{};s.lines=String(s.lyrics||'').split('\n');s.chords=s.lines.map(function(){return old});delete s.lyrics});if(!raw.sections.length)raw.sections=fresh().sections;return raw;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(song))}catch(e){}$('status').textContent='LIVE · SAVED';}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function autosize(el){el.style.height='auto';el.style.height=Math.max(50,el.scrollHeight)+'px'}
function textWidth(text){var c=document.createElement('canvas'),x=c.getContext('2d');x.font='34px Georgia';return Math.max(8,x.measureText(text).width+7)}
function render(){var box=$('sections');box.innerHTML='';song.sections.forEach(function(sec,si){var article=document.createElement('article');article.className='section';var head=document.createElement('div');head.className='section-head';head.innerHTML='<span>'+esc(sec.type)+'</span><button type="button" data-delete="'+si+'">×</button>';article.appendChild(head);sec.lines.forEach(function(text,li){article.appendChild(makeLine(si,li,text))});var help=document.createElement('div');help.className='help';help.textContent='Press Return for a new line · click above a word to add a chord';article.appendChild(help);box.appendChild(article)});updateMeta();}
function makeLine(si,li,text){var line=document.createElement('div');line.className='line';var chords=document.createElement('div');chords.className='chords';var words=text.match(/\S+\s*/g)||[];var map=song.sections[si].chords[li]||{};if(!words.length)words=[''];words.forEach(function(word,wi){var slot=document.createElement('span');slot.className='slot';slot.style.width=textWidth(word)+'px';var input=document.createElement('input');input.type='text';input.autocomplete='off';input.spellcheck=false;input.value=map[wi]||'';input.dataset.chord=si+':'+li+':'+wi;input.addEventListener('input',function(){var p=input.dataset.chord.split(':').map(Number);var m=song.sections[p[0]].chords[p[1]]||(song.sections[p[0]].chords[p[1]]={});if(input.value.trim())m[p[2]]=input.value;else delete m[p[2]];save()});slot.appendChild(input);chords.appendChild(slot)});line.appendChild(chords);var ta=document.createElement('textarea');ta.className='lyrics';ta.value=text;ta.placeholder='Begin writing…';ta.dataset.line=si+':'+li;ta.addEventListener('input',function(){var p=ta.dataset.line.split(':').map(Number);song.sections[p[0]].lines[p[1]]=ta.value;save();autosize(ta);updateMeta()});ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();splitLine(ta)}});line.appendChild(ta);setTimeout(function(){autosize(ta)},0);return line;}
function splitLine(ta){var p=ta.dataset.line.split(':').map(Number),si=p[0],li=p[1],s=song.sections[si],pos=ta.selectionStart,end=ta.selectionEnd,left=ta.value.slice(0,pos),right=ta.value.slice(end);s.lines[li]=left;s.lines.splice(li+1,0,right);s.chords.splice(li+1,0,{});save();render();focusLine(si,li+1,0)}
function focusLine(si,li,pos){var el=document.querySelector('textarea[data-line="'+si+':'+li+'"]');if(el){el.focus();el.setSelectionRange(pos,pos)}}
function updateMeta(){var n=0;song.sections.forEach(function(s){s.lines.forEach(function(l){n+=(l.match(/\S+/g)||[]).length})});$('count').textContent=n+' words';$('meta').textContent=(song.key||'C')+' · '+song.bpm+' BPM · '+song.chordsPerBar+' chords/bar';}
$('title').value=song.title;$('title').addEventListener('input',function(){song.title=this.value;save()});$('cpb').value=song.chordsPerBar;$('cpb').addEventListener('input',function(){song.chordsPerBar=Math.max(1,Math.min(16,Number(this.value)||1));save();updateMeta()});
$('sections').addEventListener('click',function(e){var d=e.target.getAttribute('data-delete');if(d!==null){song.sections.splice(Number(d),1);if(!song.sections.length)song.sections.push({type:'Verse',lines:[''],chords:[{}]});save();render()}});
$('add').addEventListener('click',function(){var types=['Verse','Pre-Chorus','Chorus','Bridge','Intro','Outro'];var name=prompt('Section name',types[song.sections.length%types.length]);if(name){song.sections.push({type:name,lines:[''],chords:[{}]});save();render();focusLine(song.sections.length-1,0,0)}});
$('print').addEventListener('click',function(){window.print()});
function freq(m){return 440*Math.pow(2,(m-69)/12)}
function root(ch){var m=String(ch||'').match(/^([A-Ga-g])([#b]?)/);if(!m)return 60;var pcs={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return 60+pcs[m[1].toUpperCase()]+(m[2]==='#'?1:m[2]==='b'?-1:0)}
function osc(m,start,dur,type,gain){if(!audio)return;var o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq(m);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(gain,start+.02);g.gain.exponentialRampToValueAtTime(.001,start+Math.max(.06,dur-.03));o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+dur)}
function syllables(word){var w=word.toLowerCase().replace(/[^a-z]/g,'');if(!w)return 1;if(w.length<=3)return 1;var n=(w.match(/[aeiouy]+/g)||[]).length;if(/e$/.test(w)&&n>1)n--;return Math.max(1,n)}
function stop(){if(stopTimer)clearTimeout(stopTimer);stopTimer=null;playing=false;$('play').textContent='▶ Play';$('play').classList.remove('playing');if(audio){audio.close();audio=null}}
$('play').addEventListener('click',async function(){if(playing){stop();return}var AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert('Audio playback is not supported in this browser.');return}audio=new AC();await audio.resume();playing=true;$('play').textContent='■ Stop';$('play').classList.add('playing');var beat=60/Math.max(30,Number(song.bpm)||120),bar=beat*4,t=audio.currentTime+.08,cpb=Math.max(1,Number(song.chordsPerBar)||4);song.sections.forEach(function(sec){sec.lines.forEach(function(line,li){var map=sec.chords[li]||{},entries=Object.keys(map).filter(function(k){return map[k]});var duration=Math.max(bar,Math.ceil(Math.max(1,(line.match(/\S+/g)||[]).length)/cpb)*bar);entries.forEach(function(k,index){var st=t+index*(bar/cpb),r=root(map[k]);osc(r,st,Math.min(bar/cpb*.9,bar*.8),'triangle',.055);osc(r+4,st+.01,Math.min(bar/cpb*.85,bar*.7),'triangle',.025);osc(r+7,st+.01,Math.min(bar/cpb*.85,bar*.7),'triangle',.025)});var words=line.match(/\S+/g)||[],sy=[];words.forEach(function(w){for(var j=0;j<syllables(w);j++)sy.push(1)});if(sy.length){var nd=duration/sy.length;sy.forEach(function(_,i){osc(72+((i*2)%10),t+i*nd,Math.min(nd*.72,.5),'sine',.025)})}t+=duration})});stopTimer=setTimeout(stop,Math.max(200,(t-audio.currentTime)*1000+300));});
render();
})();
</script>
</body></html>
