<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#111111"><title>SONGWRITER — A place for songs</title>
<style>
:root{--bg:#0f0f10;--panel:#171718;--panel2:#1d1d1f;--text:#f4f2ed;--line:#2c2c2e;--accent:#d9ff57;--warm:#f1c88b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 18px;background:#121213}.brand{font-size:15px;letter-spacing:.16em;font-weight:800;padding:0 10px 28px}.brand span{color:var(--accent)}.nav{display:grid;gap:5px}.nav button,.song-row{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#aaa;font-size:14px}.nav button.active,.nav button:hover,.song-row:hover{background:var(--panel2);color:#fff}.library{margin-top:30px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#666;padding:0 12px 9px}.song-row{width:100%;display:block}.song-row small{display:block;color:#666;margin-top:3px}.new{margin-top:16px;width:100%;border:1px solid #3a3a3c;background:transparent;border-radius:10px;padding:11px;color:#ddd}.new:hover{border-color:#666}main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.status{font-size:12px;color:#777}.profile{font-size:12px;color:#aaa}.workspace{max-width:1120px;margin:0 auto;padding:46px 38px 90px}.eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;margin-bottom:18px}.title-input{width:100%;background:transparent;border:0;outline:0;font-size:clamp(42px,7vw,82px);font-weight:750;letter-spacing:-.05em;padding:0;margin:0 0 24px}.title-input::placeholder{color:#343436}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:42px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 12px;color:#aaa;font-size:12px}.chip input{width:44px;background:none;border:0;outline:0;text-align:center}.section{margin:20px 0;border-top:1px solid var(--line);padding-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-name{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#777;font-weight:700}.remove{background:none;border:0;color:#555}.remove:hover{color:#fff}.chord-grid{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;margin-bottom:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1}.word-cell{display:flex;flex-direction:column;align-items:flex-start;margin-right:.27em;min-width:fit-content}.chord-input{height:25px;min-width:22px;width:42px;padding:0 2px;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--warm);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700;outline:0}.chord-input:focus{border-bottom-color:var(--warm);background:#19191a}.lyric-word{font-size:21px;line-height:1.65;color:#e8e6e1;white-space:pre}.lyrics{width:100%;min-height:105px;resize:none;background:transparent;border:0;outline:0;color:#e8e6e1;font-size:21px;line-height:1.65;padding:0;margin-top:2px}.lyrics::placeholder{color:#4c4b4b}.chord-hint{font-size:10px;color:#555;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px}.tool{border:1px solid var(--line);background:var(--panel);padding:10px 13px;border-radius:9px;font-size:12px;color:#bbb}.tool:hover{color:#fff;border-color:#555}.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}.primary:hover{background:#e7ff86}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 18px}.workspace{padding:32px 20px 70px}.title-input{font-size:48px}.lyrics,.lyric-word{font-size:18px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand">SONG<span>WRITER</span></div><div class="nav"><button class="active">My Songs</button><button>Ideas</button><button>Recordings</button></div><div class="library"><div class="label">Library</div><div id="songList"></div><button class="new" id="newSong">+ New song</button></div></aside><main><header class="topbar"><div class="status" id="saveStatus">Ready</div><div class="profile">A private place for your songs.</div></header><section class="workspace"><div class="eyebrow">Song workspace</div><input class="title-input" id="title" placeholder="Untitled song" aria-label="Song title"><div class="meta"><div class="chip">KEY <input id="key" value="C"></div><div class="chip">BPM <input id="bpm" value="120" type="number"></div><div class="chip" id="wordCount">0 words</div></div><div id="sections"></div><div class="toolbar"><button class="tool primary" id="addSection">+ Add section</button><button class="tool" id="saveCopy">Save snapshot</button></div></section></main></div>
<script>
const sectionTypes=['Verse','Pre-Chorus','Chorus','Bridge','Intro','Outro'];const starter={title:'Untitled song',key:'C',bpm:120,sections:[{type:'Verse',lyrics:'',chords:{}},{type:'Chorus',lyrics:'',chords:{}}]};let song=JSON.parse(localStorage.getItem('songwriter-current')||'null')||starter;const $=id=>document.getElementById(id);song.sections.forEach(s=>{if(typeof s.chords==='string')s.chords={}});
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function getWords(text){return text.trim()?text.match(/\S+/g)||[]:[]}function render(){ $('title').value=song.title;$('key').value=song.key;$('bpm').value=song.bpm;const box=$('sections');box.innerHTML='';song.sections.forEach((s,i)=>{const el=document.createElement('article');el.className='section';const ws=getWords(s.lyrics);let grid='';ws.forEach((w,j)=>{grid+=`<span class="word-cell"><input class="chord-input" data-chord="${i}:${j}" value="${escapeHtml(s.chords[j]||'')}" aria-label="Chord above ${escapeHtml(w)}"><span class="lyric-word">${escapeHtml(w)}</span></span>`});el.innerHTML=`<div class="section-head"><div class="section-name">${escapeHtml(s.type)}</div><button class="remove" data-remove="${i}" title="Remove section">×</button></div><div class="chord-grid">${grid}</div><textarea class="lyrics" data-lyrics="${i}" placeholder="Write lyrics here…">${escapeHtml(s.lyrics)}</textarea><div class="chord-hint">Click a chord space above a word and type. Leave blank if there is no chord.</div>`;box.appendChild(el)});updateCount();renderList()}
function persist(){localStorage.setItem('songwriter-current',JSON.stringify(song));$('saveStatus').textContent='Saved just now'}function updateCount(){const n=song.sections.reduce((a,s)=>a+getWords(s.lyrics).length,0);$('wordCount').textContent=n+' words'}function renderList(){const list=$('songList');list.innerHTML='';const b=document.createElement('button');b.className='song-row';b.innerHTML=`${escapeHtml(song.title||'Untitled song')}<small>${song.sections.length} sections</small>`;list.appendChild(b)}
$('title').addEventListener('input',e=>{song.title=e.target.value;persist();renderList()});$('key').addEventListener('input',e=>{song.key=e.target.value;persist()});$('bpm').addEventListener('input',e=>{song.bpm=e.target.value;persist()});
$('sections').addEventListener('input',e=>{if(e.target.dataset.chord){const [si,wi]=e.target.dataset.chord.split(':').map(Number);const value=e.target.value.trim();if(value)song.sections[si].chords[wi]=value;else delete song.sections[si].chords[wi];persist();return}if(e.target.dataset.lyrics!==undefined){const si=Number(e.target.dataset.lyrics);song.sections[si].lyrics=e.target.value;persist();updateCount()}});
$('sections').addEventListener('click',e=>{const r=e.target.dataset.remove;if(r!==undefined){song.sections.splice(Number(r),1);persist();render()}});
$('addSection').onclick=()=>{const type=prompt('Section name',sectionTypes[song.sections.length%sectionTypes.length]);if(type){song.sections.push({type,lyrics:'',chords:{}});persist();render()}};$('newSong').onclick=()=>{if(confirm('Start a new song? Your current song is saved in this browser.')){song={title:'Untitled song',key:'C',bpm:120,sections:[{type:'Verse',lyrics:'',chords:{}},{type:'Chorus',lyrics:'',chords:{}}]};persist();render()}};$('saveCopy').onclick=()=>{const blob=new Blob([JSON.stringify(song,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(song.title||'song').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
