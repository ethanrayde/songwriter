<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1eee6"><title>SONGWRITER — work in progress</title><style>
:root{--paper:#f1eee6;--ink:#161616;--muted:#88847c;--red:#ad3a30;--line:#d5d0c5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Georgia,'Times New Roman',serif}.top{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-family:Arial,sans-serif}.logo{font-size:13px;letter-spacing:.2em;font-weight:800}.logo em{color:var(--red);font-style:normal}.status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.workspace{max-width:980px;margin:auto;padding:8vh 6vw 14vh}.meta{font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.meta input{border:0;border-bottom:1px solid #aaa;background:transparent;width:35px;outline:0;text-align:center;font:10px Arial,sans-serif}.title{width:100%;border:0;outline:0;background:none;font:normal clamp(52px,9vw,112px)/.88 Georgia,'Times New Roman',serif;letter-spacing:-.055em;color:var(--ink);padding:0;margin:0 0 62px}.title::placeholder{color:#c8c3b8}.section{margin:0 0 66px}.section-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-bottom:17px;font:700 10px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.delete{border:0;background:none;color:#aaa;font-size:18px}.delete:hover{color:var(--red)}.line{margin:0 0 16px}..chords{min-height:28px;display:flex;align-items:flex-end;overflow:visible;font:700 14px 'Courier New',monospace;color:var(--red);white-space:pre}.chord-slot{display:inline-block;position:relative;height:28px;margin-right:.27em;flex:0 0 auto}.chord-slot input{position:absolute;left:-2px;bottom:1px;width:54px;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;color:var(--red);font:700 14px 'Courier New',monospace;padding:0}.chord-slot input:focus{border-bottom-color:var(--red)}.line-text{width:100%;min-height:42px;display:block;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:var(--ink);font:normal clamp(24px,3vw,34px)/1.45 Georgia,'Times New Roman',serif;letter-spacing:-.015em;padding:0}.line-text::placeholder{color:#bdb8ae}.hint{font:10px Arial,sans-serif;color:#aaa;margin-top:4px;opacity:0}.line:hover .hint{opacity:1}.actions{display:flex;gap:9px;flex-wrap:wrap;font-family:Arial,sans-serif}.btn{background:none;border:1px solid #bcb7ac;padding:12px 16px;font-size:10px;letter-spacing:.09em;text-transform:uppercase}.btn:hover{background:#e5e0d6}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.play{background:var(--red);color:white;border-color:var(--red)}
@media(max-width:700px){.top{height:60px}.workspace{padding:50px 24px 90px}.title{font-size:58px;margin-bottom:45px}.section{margin-bottom:52px}.line-text{font-size:23px}.meta{gap:10px}}
@media print{body{background:white}.top,.actions,.hint,.delete{display:none!important}.workspace{max-width:none;width:100%;padding:0 12mm;margin:0}.meta{justify-content:center;margin:0 0 9mm;padding-top:0;color:#222}.title{text-align:center;font-size:32pt;margin:0 0 12mm}.section{margin:0 0 9mm;break-inside:avoid}.section-head{border:0;text-align:center;justify-content:center;padding:0;margin:0 0 5mm;color:#333;font-size:8pt}.chords{color:#111}.chord-slot input{color:#111}.line-text{font-size:13pt;line-height:1.5;min-height:0}.status{display:none}}
</style></head><body><header class="top"><div class="logo">SONG<em>WRITER</em></div><div class="status" id="status">LIVE · SAVED</div></header><main class="workspace"><div class="meta"><span>private workspace</span><span id="wordCount">0 words</span><span>KEY <input id="key" value="C"></span><span>BPM <input id="bpm" value="120" type="number"></span><span>CHORDS/BAR <input id="cpb" value="1" type="number" min="1" max="8"></span></div><input class="title" id="title" placeholder="Untitled" autocomplete="off"><div id="sections"></div><div class="actions"><button class="btn primary" id="add">+ Section</button><button class="btn play" id="play">▶ Play song</button><button class="btn" id="print">Print standard</button><button class="btn" id="snapshot">Export</button></div></main><script>
let song=JSON.parse(localStorage.getItem('songwriter-current')||'null')||{title:'',key:'C',bpm:120,chordsPerBar:1,sections:[{type:'Verse',lines:[''],chords:[{}]},{type:'Chorus',lines:[''],chords:[{}]}]};migrate();const $=x=>document.getElementById(x);let audio=null,stopTimer=null;
function migrate(){song.key=song.key||'C';song.bpm=song.bpm||120;song.chordsPerBar=song.chordsPerBar||1;song.sections.forEach(s=>{if(s.lines){s.lines=Array.isArray(s.lines)?s.lines:[''];s.chords=Array.isArray(s.chords)?s.chords.map(x=>x||{}):s.lines.map(()=>({}));return}let old=s.lyrics||'';let parts=old.split('\n');let oldCh=s.chords||{};s.lines=parts;s.chords=parts.map(()=>({}));Object.keys(oldCh).forEach(k=>{let n=+k;let line=0;let word=n;s.lines.slice(0,-1).forEach((x,i)=>{word-=countWords(x);if(word<0){line=i;return}});if(word>=0)line=s.lines.length-1;s.chords[line][Math.max(0,word)]=oldCh[k]});delete s.lyrics;});}
function save(){localStorage.setItem('songwriter-current',JSON.stringify(song));$('status').textContent='LIVE · SAVED'}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function countWords(t){return (t.trim().match(/\S+/g)||[]).length}function measure(t){const c=document.createElement('canvas'),x=c.getContext('2d');x.font='34px Georgia';return x.measureText(t).width+8}
function render(){const box=$('sections');box.innerHTML='';song.sections.forEach((s,si)=>{const art=document.createElement('article');art.className='section';art.innerHTML=`<div class="section-head"><span>${esc(s.type)}</span><button class="delete" data-del="${si}">×</button></div><div data-lines></div>`;box.appendChild(art);const lines=art.querySelector('[data-lines]');s.lines.forEach((text,li)=>renderLine(lines,si,li,text));});updateMeta()}
function renderLine(parent,si,li,text){const row=document.createElement('div');row.className='line';const chord=document.createElement('div');chord.className='chords';const words=text.match(/\S+\s*/g)||[];if(!words.length)words.push('');words.forEach((w,wi)=>{const slot=document.createElement('span');slot.className='chord-slot';slot.style.width=Math.max(8,measure(w))+'px';const inp=document.createElement('input');inp.value=song.sections[si].chords[li]?.[wi]||'';inp.setAttribute('aria-label','Chord');inp.addEventListener('input',()=>{song.sections[si].chords[li]=song.sections[si].chords[li]||{};if(inp.value.trim())song.sections[si].chords[li][wi]=inp.value;else delete song.sections[si].chords[li][wi];save()});slot.appendChild(inp);chord.appendChild(slot)});const ta=document.createElement('textarea');ta.className='line-text';ta.value=text;ta.placeholder=li===0?'Begin writing…':'';ta.dataset.si=si;ta.dataset.li=li;ta.addEventListener('input',()=>{song.sections[si].lines[li]=ta.value;save();auto(ta);refreshLineChords(row,si,li,ta.value);updateMeta()});ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const before=ta.value.slice(0,ta.selectionStart),after=ta.value.slice(ta.selectionEnd);song.sections[si].lines[li]=before;song.sections[si].lines.splice(li+1,0,after);song.sections[si].chords.splice(li+1,0,{});save();render();setTimeout(()=>focusLine(si,li+1),0)}});const hint=document.createElement('div');hint.className='hint';hint.textContent='Click above a word to place a chord · return for a new line';row.append(chord,ta,hint);parent.appendChild(row);auto(ta)}
function refreshLineChords(row,si,li,text){const c=row.querySelector('.chords');const old=row.querySelectorAll('input');const vals=[...old].map(x=>x.value);c.innerHTML='';const words=text.match(/\S+\s*/g)||[''];words.forEach((w,wi)=>{const slot=document.createElement('span');slot.className='chord-slot';slot.style.width=Math.max(8,measure(w))+'px';const inp=document.createElement('input');inp.value=song.sections[si].chords[li]?.[wi]||vals[wi]||'';inp.addEventListener('input',()=>{song.sections[si].chords[li]=song.sections[si].chords[li]||{};if(inp.value.trim())song.sections[si].chords[li][wi]=inp.value;else delete song.sections[si].chords[li][wi];save()});slot.appendChild(inp);c.appendChild(slot)})}
function focusLine(si,li){const t=document.querySelector(`textarea[data-si="${si}"][data-li="${li}"]`);if(t){t.focus();t.setSelectionRange(0,0)}}function auto(t){t.style.height='auto';t.style.height=Math.max(42,t.scrollHeight)+'px'}function updateMeta(){let n=0;song.sections.forEach(s=>s.lines.forEach(x=>n+=countWords(x)));$('wordCount').textContent=n+' words';$('key').value=song.key;$('bpm').value=song.bpm;$('cpb').value=song.chordsPerBar}
$('title').value=song.title;$('title').addEventListener('input',e=>{song.title=e.target.value;save()});$('key').addEventListener('input',e=>{song.key=e.target.value;save()});$('bpm').addEventListener('input',e=>{song.bpm=Math.max(30,Math.min(300,+e.target.value||120));save()});$('cpb').addEventListener('input',e=>{song.chordsPerBar=Math.max(1,Math.min(8,+e.target.value||1));save()});$('add').onclick=()=>{const type=prompt('Section', ['Verse','Pre-Chorus','Chorus','Bridge','Intro','Outro'][song.sections.length%6]);if(type){song.sections.push({type,lines:[''],chords:[{}]});save();render()}};$('sections').addEventListener('click',e=>{if(e.target.dataset.del!==undefined){song.sections.splice(+e.target.dataset.del,1);save();render()}});$('print').onclick=()=>window.print();$('snapshot').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(song,null,2)],{type:'application/json'}));a.download=(song.title||'untitled').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click()};
function syllables(word){word=word.toLowerCase().replace(/[^a-z]/g,'');if(!word)return 1;let m=word.match(/[aeiouy]+/g);let n=m?m.length:1;if(word.endsWith('e')&&n>1)n--;return Math.max(1,n)}function noteFreq(n){return 440*Math.pow(2,(n-69)/12)}const scale=[0,2,4,5,7,9,11];function keyRoot(k){const names={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};return names[k]??0}function chordNotes(ch){const root=ch.replace(/[^A-G#b]/g,'')||song.key;const quality=ch.slice(root.length);const r=keyRoot(root);let ints=quality.includes('m')?[0,3,7]:quality.includes('dim')?[0,3,6]:[0,4,7];if(quality.includes('7'))ints.push(10);return ints.map(x=>48+r+x)}
function play(){if(audio){audio.close();audio=null;clearTimeout(stopTimer);$('play').textContent='▶ Play song';return}audio=new (window.AudioContext||window.webkitAudioContext)();const bpm=Math.max(30,Math.min(300,+song.bpm||120)),beat=60/bpm, bar=beat*4, cpb=Math.max(1,+song.chordsPerBar||1);let t=audio.currentTime+.08;let melodyBase=60+keyRoot(song.key);song.sections.forEach(sec=>{sec.lines.forEach(line=>{const words=line.match(/\S+/g)||[];const duration=bar;const chordDur=bar/cpb;let chordWords=[];Object.keys(sec.chords[sec.lines.indexOf(line)]||{}).forEach(i=>chordWords.push([+i,sec.chords[sec.lines.indexOf(line)][i]]));for(let b=0;b<cpb;b++){const c=chordWords[b]?.[1]||chordWords[0]?.[1]||song.key;const ns=chordNotes(c);ns.forEach(n=>osc(n,t+b*chordDur,chordDur*.9,.045));}let total=words.reduce((a,w)=>a+syllables(w),0)||1;let st=t;let idx=0;words.forEach(w=>{const syl=syllables(w);for(let q=0;q<syl;q++){const d=duration/total;const note=melodyBase+scale[(idx+q)%scale.length]+12;osc(note,st,d*.78,.045,'triangle');st+=d}idx+=syl});t+=duration})});stopTimer=setTimeout(()=>{if(audio){audio.close();audio=null;$('play').textContent='▶ Play song'}},Math.max(100,(t-audio.currentTime)*1000+200));$('play').textContent='■ Stop'}function osc(midi,start,dur,gain,type='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=noteFreq(midi);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(gain,start+.015);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.connect(g).connect(audio.destination);o.start(start);o.stop(start+dur+.03)}$('play').onclick=play;render();
</script></body></html>
