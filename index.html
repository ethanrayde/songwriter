<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONGWRITER</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}.top{padding:18px 28px;border-bottom:1px solid #333;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.15em}.version{color:#ff684f}.compose{max-width:1250px;margin:auto;padding:70px 6vw}.hero{font:clamp(55px,8vw,110px) Georgia;margin:20px 0 60px;letter-spacing:-.06em}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:70px}.card{border-top:1px solid #555;padding-top:14px}.label{font-size:10px;letter-spacing:.18em;text-transform:uppercase}.box{width:100%;min-height:340px;background:none;border:0;outline:0;color:#eee;font:23px/1.55 Georgia;resize:vertical}.inspire{color:#d6cdbd}.density{margin-top:25px;border-top:1px solid #444;padding-top:18px}.density-head{display:flex;justify-content:space-between;text-transform:uppercase;font-size:10px;letter-spacing:.15em}.range{width:100%;margin:18px 0 5px;accent-color:#ff684f;cursor:pointer}.density-desc{text-align:center;color:#888;font-size:12px}.actions{margin-top:25px;display:flex;gap:10px}.btn{padding:12px 16px;background:transparent;color:#aaa;border:1px solid #555;cursor:pointer;text-transform:uppercase;font-size:10px;letter-spacing:.12em}.primary{background:#eee;color:#111}.lead{background:#e9e5dc;color:#181817;min-height:100vh;padding:30px 4vw}.lead-inner{max-width:1500px;margin:auto}.nav{display:flex;justify-content:space-between}.title{text-align:center;width:100%;border:0;background:none;outline:0;font:clamp(50px,7vw,90px) Georgia}.meta,.note{text-align:center;color:#777;margin:12px}.section{margin:65px 0}.section-name{text-align:center;text-transform:uppercase;letter-spacing:.2em;color:#777;border:0;border-top:1px solid #bbb;border-bottom:1px solid #bbb;background:none;width:100%;padding:10px}.line{margin:38px 0}.timeline{overflow-x:auto;padding:48px 0 15px}.track{display:flex;align-items:flex-start;width:max-content;min-width:100%}.event{flex:0 0 auto;min-width:55px;margin-right:16px}.chords{height:30px;display:flex;gap:10px;white-space:nowrap}.chord{font:bold 15px monospace}.word{font:21px Georgia;white-space:nowrap}.count{text-align:right;color:#999;font-size:9px}.editor{width:100%;border:0;border-bottom:1px dashed #bbb;background:none;outline:0;resize:none;color:#666}.tools{text-align:center;margin:30px}.extra{display:grid;grid-template-columns:1fr 1fr;gap:50px;border-top:1px solid #bbb;padding-top:25px}.extra h3{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#888}@media(max-width:800px){.grid,.extra{grid-template-columns:1fr}.compose{padding:45px 24px}.box{min-height:240px}}@media print{.top,.nav,.tools,.editor{display:none}.lead{padding:0;background:#fff}.timeline{overflow:visible}.track{min-width:0;flex-wrap:wrap}}</style></head><body><header class="top"><b>SONGWRITER</b><span><span class="version">v0.18</span> · <span id="status">READY</span></span></header><main><section id="compose"><div class="compose"><small>WRITING ROOM</small><h1 class="hero">Get it out.<br><i>Then shape it.</i></h1><div class="grid"><section class="card"><div class="label">Lyrics</div><textarea id="lyrics" class="box" placeholder="Write without thinking about chords."></textarea></section><section class="card"><div class="label">Inspiration</div><textarea id="inspiration" class="box inspire" placeholder="Describe the sound, artist, era, feeling, tempo, or paste a chord chart."></textarea><div class="density"><div class="density-head"><span>Harmonic density</span><span id="densityName">Balanced</span></div><input id="density" class="range" type="range" min="0" max="3" step="1" value="1"><div id="densityDesc" class="density-desc"></div></div></section></div><div class="actions"><button id="develop" class="btn primary">Develop song →</button><button id="new" class="btn">New song</button></div></div></section><section id="lead" hidden><div class="lead"><div class="lead-inner"><div class="nav"><button id="back" class="btn">← Writing room</button><button id="print" class="btn">Print / PDF</button></div><input id="title" class="title" value="Untitled"><div id="meta" class="meta"></div><div id="note" class="note"></div><div id="sheet"></div><div class="tools"><button class="btn" onclick="addSec('Verse')">+ Verse</button><button class="btn" onclick="addSec('Chorus')">+ Chorus</button><button class="btn" onclick="addSec('Bridge')">+ Bridge</button></div><div class="extra"><div><h3>Melodic direction</h3><p id="melody"></p></div><div><h3>Arrangement</h3><p id="arrangement"></p></div></div></div></div></section></main><script>const $=x=>document.getElementById(x),levels=[['Simple','Singer-songwriter simplicity.'],['Balanced','Tasteful extensions, inversions and voice-leading.'],['Rich','Frequent extensions, passing chords and sophisticated voice-leading.'],['Dense','Maximum harmonic movement: full walkdowns, chromatic passing harmony, rich extensions and Beach Boys/jazz-standard-level color when musically justified.']],store='songwriter-studio-v18';let state=JSON.parse(localStorage.getItem(store)||'null')||{draft:null,lyrics:'',inspiration:'',density:1};$('lyrics').value=state.lyrics||'';$('inspiration').value=state.inspiration||'';$('density').value=state.density;function setDensity(){let x=levels[state.density];$('densityName').textContent=x[0];$('densityDesc').textContent=x[1]}setDensity();$('density').oninput=()=>{state.density=+$('density').value;localStorage.setItem(store,JSON.stringify(state));setDensity()};['lyrics','inspiration'].forEach(id=>$(id).oninput=()=>{state[id]=$(id).value;localStorage.setItem(store,JSON.stringify(state))});$('new').onclick=()=>{state={draft:null,lyrics:'',inspiration:'',density:+$('density').value};localStorage.setItem(store,JSON.stringify(state));$('lyrics').value='';$('inspiration').value='';};$('print').onclick=()=>print();$('back').onclick=()=>{$('lead').hidden=true;$('compose').hidden=false};$('title').oninput=()=>{if(state.draft){state.draft.title=$('title').value;localStorage.setItem(store,JSON.stringify(state))}};async function develop(){let lyrics=$('lyrics').value.trim(),inspiration=$('inspiration').value.trim();if(!lyrics)return;let b=$('develop');b.disabled=true;b.textContent='Developing…';$('status').textContent='DEVELOPING…';try{let r=await fetch('/api/develop',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({lyrics,inspiration,harmonicDensity:levels[state.density][0],harmonicDensityInstruction:levels[state.density][1],requireUnlimitedChordEvents:true})}),raw=await r.text(),d=JSON.parse(raw);if(!r.ok)throw Error(d.error||'Development failed');state.draft=d;state.lyrics=lyrics;state.inspiration=inspiration;localStorage.setItem(store,JSON.stringify(state));render();$('compose').hidden=true;$('lead').hidden=false;$('status').textContent='SAVED'}catch(e){$('status').textContent='ERROR';alert('Song development failed: '+e.message)}finally{b.disabled=false;b.textContent='Develop song →'}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let d=state.draft;if(!d)return;$('title').value=d.title||'Untitled';$('meta').textContent=[d.key||'C',Math.round(d.bpm||78)+' BPM',d.timeSignature||'4/4',d.genre||''].join(' · ');$('note').textContent=d.feel||'';$('melody').textContent=d.melody?JSON.stringify(d.melody):'';$('arrangement').textContent=d.arrangement||'';let out='';(d.sections||[]).forEach(s=>{out+='<section class="section"><input class="section-name" value="'+esc(s.name||'Section')+'">';(s.lines||[]).forEach(l=>{let words=(l.text||'').trim().split(/\s+/).filter(Boolean),map={};(l.bars||[]).forEach((bar,bi)=>(bar.chords||[]).forEach((c,ci)=>{let o=typeof c==='string'?{name:c,wordIndex:ci}:c,wi=Math.max(0,Math.min(words.length-1,Number(o.wordIndex)||0));(map[wi]??=[]).push(o)}));out+='<div class="line"><div class="timeline"><div class="track">';words.forEach((w,i)=>{out+='<div class="event"><div class="chords">'+(map[i]||[]).map(c=>'<span class="chord">'+esc(c.name||c.chord)+'</span>').join('')+'</div><div class="word">'+esc(w)+'</div></div>'});out+='</div></div><div class="count">'+(l.bars||[]).length+' bars · '+(l.bars||[]).reduce((n,b)=>n+(b.chords||[]).length,0)+' chord changes</div><textarea class="editor">'+esc(l.text||'')+'</textarea></div>'});out+='</section>'});$('sheet').innerHTML=out}function addSec(n){if(!state.draft)return;state.draft.sections.push({name:n,lines:[{text:'',bars:[{chords:[]}]}]});localStorage.setItem(store,JSON.stringify(state));render()}$('develop').onclick=develop;if(state.draft)render();</script></body></html>
