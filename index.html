<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1eee6"><title>SONGWRITER — work in progress</title><style>
:root{--paper:#f1eee6;--ink:#161616;--muted:#8b8880;--red:#b43b2f;--line:#d7d2c7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Georgia,'Times New Roman',serif}.app{min-height:100vh}.top{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-family:Arial,sans-serif}.logo{font-size:13px;letter-spacing:.2em;font-weight:800}.logo em{color:var(--red);font-style:normal}.status{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.workspace{max-width:980px;margin:auto;padding:9vh 6vw 18vh}.meta{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:22px;margin-bottom:24px}.title{width:100%;border:0;outline:0;background:none;font:normal clamp(52px,9vw,112px)/.88 Georgia,'Times New Roman',serif;letter-spacing:-.055em;color:var(--ink);padding:0;margin:0 0 65px}.title::placeholder{color:#c8c3b8}.section{margin:0 0 78px}.section-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-bottom:18px;font:700 10px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.delete{border:0;background:none;color:#aaa;font-size:18px}.delete:hover{color:var(--red)}.paper{position:relative}.chords{min-height:31px;display:flex;align-items:flex-end;gap:0;font:700 14px/1.1 'Courier New',monospace;color:var(--red);white-space:pre-wrap}.slot{display:inline-block;position:relative;min-width:8px;margin-right:.27em;height:31px}.slot input{position:absolute;left:-3px;bottom:0;width:54px;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;color:var(--red);font:700 14px 'Courier New',monospace;padding:0}.slot input:focus{border-bottom-color:var(--red)}.lyrics{display:block;width:100%;min-height:52px;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:var(--ink);font:normal clamp(24px,3vw,34px)/1.55 Georgia,'Times New Roman',serif;letter-spacing:-.015em;padding:0;margin:0}.lyrics::placeholder{color:#bdb8ae}.hint{font:11px Arial,sans-serif;color:#aaa;margin-top:10px;opacity:0;transition:.2s}.paper:hover .hint{opacity:1}.actions{display:flex;gap:10px;font-family:Arial,sans-serif}.btn{background:none;border:1px solid #bcb7ac;padding:12px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.btn:hover{background:#e6e1d6}.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.primary:hover{background:#333}.cursor{display:inline-block;width:1px;height:1em;background:var(--red);vertical-align:-.08em;margin-left:2px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media(max-width:700px){.top{height:60px}.workspace{padding:50px 24px 100px}.title{font-size:58px;margin-bottom:45px}.section{margin-bottom:55px}.lyrics{font-size:23px}.meta{gap:12px}}
</style></head><body><div class="app"><header class="top"><div class="logo">SONG<em>WRITER</em></div><div class="status" id="status">LIVE · SAVED</div></header><main class="workspace"><div class="meta"><span>private workspace</span><span id="wordCount">0 words</span><span id="songMeta">C · 120 BPM</span></div><input class="title" id="title" placeholder="Untitled" autocomplete="off"><div id="sections"></div><div class="actions"><button class="btn primary" id="add">+ Section</button><button class="btn" id="snapshot">Export</button></div></main></div><script>
const types=['Verse','Pre-Chorus','Chorus','Bridge','Intro','Outro'];let song=JSON.parse(localStorage.getItem('songwriter-current')||'null')||{title:'',key:'C',bpm:120,sections:[{type:'Verse',lyrics:'',chords:{}},{type:'Chorus',lyrics:'',chords:{}}]};song.sections.forEach(s=>{if(typeof s.chords==='string')s.chords={}});const $=x=>document.getElementById(x);let renderTimer;
function save(){localStorage.setItem('songwriter-current',JSON.stringify(song));$('status').textContent='LIVE · SAVED';clearTimeout(renderTimer);renderTimer=setTimeout(()=>{$('status').textContent='LIVE · SAVED'},500)}
function autosize(el){el.style.height='auto';el.style.height=Math.max(52,el.scrollHeight)+'px'}
function renderSections(){const box=$('sections');box.innerHTML='';song.sections.forEach((s,si)=>{const article=document.createElement('article');article.className='section';article.innerHTML=`<div class="section-head"><span>${escape(s.type)}</span><button class="delete" data-delete="${si}">×</button></div><div class="paper"><div class="chords" data-chords="${si}"></div><textarea class="lyrics" data-lyrics="${si}" placeholder="Begin writing…">${escape(s.lyrics)}</textarea><div class="hint">Click above a word to place a chord · type normally below</div></div>`;box.appendChild(article);const ta=article.querySelector('textarea');autosize(ta);buildChordSlots(article.querySelector('.chords'),si)});updateMeta()}
function buildChordSlots(container,si){const s=song.sections[si];const text=s.lyrics;const parts=text.match(/\S+\s*/g)||[];if(!parts.length){const slot=document.createElement('span');slot.className='slot';const input=document.createElement('input');input.placeholder='';input.dataset.chord='0';input.addEventListener('input',e=>setChord(si,0,e.target.value));slot.appendChild(input);container.appendChild(slot);return}parts.forEach((part,i)=>{const slot=document.createElement('span');slot.className='slot';slot.style.width=Math.max(8,measure(part))+'px';const input=document.createElement('input');input.value=s.chords[i]||'';input.placeholder='';input.dataset.chord=i;input.addEventListener('input',e=>setChord(si,i,e.target.value));slot.appendChild(input);container.appendChild(slot)})}
function measure(t){const c=document.createElement('canvas'),x=c.getContext('2d');x.font='34px Georgia';return x.measureText(t).width+8}function setChord(si,wi,v){if(v.trim())song.sections[si].chords[wi]=v;else delete song.sections[si].chords[wi];save()}
function updateMeta(){let n=0;song.sections.forEach(s=>n+=(s.lyrics.trim().match(/\S+/g)||[]).length);$('wordCount').textContent=n+' words';$('songMeta').textContent=(song.key||'C')+' · '+(song.bpm||120)+' BPM'}function escape(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
$('title').value=song.title;$('title').addEventListener('input',e=>{song.title=e.target.value;save()});$('sections').addEventListener('input',e=>{if(e.target.dataset.lyrics!==undefined){const si=+e.target.dataset.lyrics;song.sections[si].lyrics=e.target.value;save();autosize(e.target);updateMeta();queueMicrotask(()=>buildChordSlots(e.target.closest('.paper').querySelector('.chords'),si))}});$('sections').addEventListener('click',e=>{const d=e.target.dataset.delete;if(d!==undefined){song.sections.splice(+d,1);save();renderSections()}});$('add').onclick=()=>{const type=prompt('Section',types[song.sections.length%types.length]);if(type){song.sections.push({type,lyrics:'',chords:{}});save();renderSections()}};$('snapshot').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(song,null,2)],{type:'application/json'}));a.download=(song.title||'untitled').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click()};renderSections();
</script></body></html>
